name: Windows portable

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install "uv==0.12.7"
      - name: Verify dependency locks
        shell: pwsh
        run: |
          uv pip compile pyproject.toml --extra voice --extra dev --python-version 3.12 --python-platform windows --output-file requirements-win.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- requirements-win.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip compile pyproject.toml --extra voice --extra dev --extra build --python-version 3.12 --python-platform windows --constraint requirements-win.lock --output-file requirements-win-build.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- requirements-win-build.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install clean build environment
        shell: pwsh
        run: |
          python -m venv .venv-ci
          uv pip install --python .venv-ci\Scripts\python.exe -r requirements-win-build.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --python .venv-ci\Scripts\python.exe --no-deps --no-build-isolation .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test
        run: .\.venv-ci\Scripts\python.exe -m pytest --basetemp=.pytest-tmp
      - name: Build portable
        shell: pwsh
        run: |
          git status --short
          .\.venv-ci\Scripts\python.exe scripts/build_portable.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Extracted application smoke
        run: .\.venv-ci\Scripts\python.exe scripts/smoke_portable.py dist/wechat-local-archive-windows-x64-v0.2.4.zip
      - name: Verify tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: .\.venv-ci\Scripts\python.exe scripts/verify_release.py dist/wechat-local-archive-windows-x64-v0.2.4.zip
      - name: Diff check
        run: git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: wechat-local-archive-windows-x64
          path: |
            dist/wechat-local-archive-windows-x64-v0.2.4.zip
            dist/wechat-local-archive-windows-x64-v0.2.4.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: wechat-local-archive-windows-x64
          path: dist
      - name: Verify release provenance
        run: python scripts/verify_release.py dist/wechat-local-archive-windows-x64-v0.2.4.zip
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist/wechat-local-archive-windows-x64-v0.2.4.zip dist/wechat-local-archive-windows-x64-v0.2.4.zip.sha256 --verify-tag --title "WeChat Local Archive $env:GITHUB_REF_NAME" --notes-file docs/release-v0.2.4.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
