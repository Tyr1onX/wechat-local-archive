[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "wechat-local-archive"
version = "0.2.0"
description = "Read-only local WeChat 4.x archive exporter with fast offline voice transcription."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Tyr1onX" }]
dependencies = [
  "wechatauto-replica>=1.2.0.3,<1.3",
]

[project.optional-dependencies]
voice = [
  "silk-python==0.2.8",
  "funasr-onnx>=0.4.2,<0.5",
  "modelscope>=1.39,<2",
]
verify = [
  "faster-whisper==1.2.1",
  "ctranslate2==4.8.2",
]
dev = [
  "hatchling>=1.25,<2",
  "pytest>=8.4,<9",
]
build = [
  "pyinstaller==6.16.0",
  "pyinstaller-hooks-contrib==2025.9",
]

[project.scripts]
wechat-archive = "wechat_local_archive.cli:main"

[project.gui-scripts]
wechat-archive-gui = "wechat_local_archive.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wechat_local_archive"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
